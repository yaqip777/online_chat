services:
  db:
    image: postgres:16-alpine
    container_name: online_chat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-online_chat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-online_chat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chat_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: online_chat_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-online_chat}
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - chat_network

volumes:
  postgres_data:
    driver: local

networks:
  chat_network:
    driver: bridge

# ==============================================================
# ONLINE CHAT - PRODUCTION NGINX CONFIGURATION
# ==============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream backend_server {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your_domain_or_ip.com;

    # Katta hajmdagi video/rasmlarni yuklash uchun (60MB)
    client_max_body_size 60M;

    # Gzip siqish
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Statik yuklangan fayllarni Nginx orqali to'g'ridan-to'g'ri berish (Tezlikni oshirish)
    location /uploads/ {
        alias /var/www/online_chat/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Barcha API va WebSocket so'rovlarini FastAPI ga yo'naltirish
    location / {
        proxy_pass http://backend_server;
        proxy_http_version 1.1;

        # WebSocket qo'llab-quvvatlash
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Mijoz ma'lumotlarini uzatish
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout sozlamalari (WebSocket uzilib qolmasligi uchun)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
